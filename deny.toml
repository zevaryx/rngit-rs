# cargo-deny checks for rngit. Same policy as rettui's deny.toml.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
  'MIT',
  'MIT-0',
  'Apache-2.0',
  'BSD-2-Clause',
  'BSD-3-Clause',
  'BSL-1.0',
  'CDLA-Permissive-2.0',
  'ISC',
  'CC0-1.0',
  '0BSD',
  'Unlicense',
  'MPL-2.0',
  'EPL-2.0',
  'Zlib',
  'LGPL-2.1',
  'LGPL-2.1-or-later',
  'LGPL-3.0-or-later',
  'GPL-3.0-or-later',
  'AGPL-3.0-or-later',
  'LicenseRef-Reticulum',
  'bzip2-1.0.6',
  'Unicode-3.0',
]
unused-allowed-license = "allow"
confidence-threshold = 0.8

# rsReticulum's Reticulum License, which has no SPDX identifier. A changed
# license file stops matching, and the crate is checked again.
[[licenses.clarify]]
crate = "rns-crypto"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-identity"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-interface"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-link"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-protocol"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-runtime"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-transport"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]
[[licenses.clarify]]
crate = "rns-wire"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "../../LICENSE", hash = 0xf930d1af }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["zevaryx"]
